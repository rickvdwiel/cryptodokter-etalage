name: koppel-app
on:
  push:
    branches: [installeerbare-app]
permissions:
  contents: write
jobs:
  koppel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: installeerbare-app
      - name: Koppel manifest en service worker
        run: python3 tools/koppel-app.py
      - name: Zet de paginakoppeling op de branch
        run: |
          git config user.name "rickvdwiel"
          git config user.email "rickvdwiel@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Koppel de app-schil in de pagina"
          git push

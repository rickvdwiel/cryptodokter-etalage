<!doctype html>
<html lang="nl" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1016">
<meta name="robots" content="noindex">
<title>Pagina niet gevonden — CryptoDokter</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<style>
:root{--bg:#0c1016;--surf:#131921;--line:#243041;--tx:#E8EEF5;--muted:#8B98A8;--accent:#4B9CF5;--up:#3dd68c;
--font:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
background:var(--bg);color:var(--tx);font:15px/1.55 var(--font);padding:24px;-webkit-font-smoothing:antialiased}
.card{max-width:460px;width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surf);padding:32px 26px;text-align:center}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--tx);text-decoration:none;margin-bottom:22px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(75,156,245,.18)}
.code{font:700 44px/1 var(--mono);color:var(--accent);margin:0 0 10px;letter-spacing:-.02em}
h1{margin:0 0 8px;font-size:20px;letter-spacing:-.02em}
p{margin:0 0 20px;color:var(--muted)}
.btn{display:inline-block;padding:12px 18px;border-radius:10px;background:var(--accent);color:#0a1018;font-weight:600;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.foot{margin-top:18px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="card">
  <a class="brand" href="/"><span class="dot" aria-hidden="true"></span>CryptoDokter</a>
  <p class="code">404</p>
  <h1>Deze pagina bestaat niet</h1>
  <p>De link is verouderd of verkeerd getypt. De paper-tape staat gewoon op de homepage.</p>
  <a class="btn" href="/">Terug naar CryptoDokter</a>
</main>
<p class="foot">Paper-only · geen live orders · geen beleggingsadvies</p>
</body>
</html>
